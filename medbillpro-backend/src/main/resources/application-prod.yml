  datasource:
    url: mysql://${{MYSQLUSER}}:${{MYSQL_ROOT_PASSWORD}}@${{RAILWAY_PRIVATE_DOMAIN}}:3306/${{MYSQL_DATABASE}}
    MYSQLUSER: root
    MYSQL_ROOT_PASSWORD: ErqKLVvbWfWgZqZeBwtEWzAWLvpAEHXu
    MYSQL_DATABASE : railway

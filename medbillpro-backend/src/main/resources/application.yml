# application.yml

spring:
  name: Medical_Bill_Pro
  datasource:
    url: jdbc:mysql://localhost:3306/Medical_Bill_Pro
    username: admin
    password: test123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  cors:
    allowed-origins: "http://localhost:5089,http://localhost:3000"






server:
  port: 8081
  servlet:
   # context-path: /api

medbillpro:
  app:
    jwtSecret: medBillProSecretKey
    jwtExpirationMs: 86400000

logging:
  level:
    com.medbillpro: DEBUG
    org.springframework.security: DEBUG

